<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101810">
<title>Monster Rush: Survival</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="gameShell">
<canvas id="gameCanvas"></canvas>
<section id="startScreen" class="overlay"><div class="panel">
<p class="eyebrow">MOUNTAIN OUTPOST</p><h1>MONSTER <span>RUSH</span></h1><p class="subtitle">SURVIVAL PROTOCOL</p>
<p>Survive 10 waves. The horde never waits.</p><button id="startButton">START SURVIVAL</button>
<p class="hint">Move with the left joystick. Your weapon fires automatically.</p>
</div></section>
<section id="gameOverScreen" class="overlay hidden"><div class="panel">
<p class="eyebrow">MOUNTAIN OUTPOST</p><h1 id="endTitle">RUN OVER</h1><p id="endMessage"></p><button id="retryButton">TRY AGAIN</button>
</div></section>
<section id="hud" class="hud hidden">
<div class="stat"><small>WAVE</small><strong id="waveText">1 / 10</strong></div>
<div class="stat"><small>KILLS</small><strong id="killsText">0</strong></div>
<div class="health"><small>HEALTH <b id="healthText">100</b></small><div class="track"><div id="healthFill"></div></div></div>
<div class="stat coins">◆ <strong id="coinsText">0</strong></div>
</section>
<div id="joystick" class="joystick hidden"><div id="stickKnob"></div></div>
<div id="rotateNotice" class="rotate-notice"><b>↻</b><strong>ROTATE YOUR PHONE</strong><span>Monster Rush is played in landscape.</span></div>
</main><script src="game.js"></script>
</body></html>
